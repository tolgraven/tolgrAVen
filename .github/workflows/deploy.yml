name: Validate source (legacy CapRover opt-in)

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  validate-css:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the source workspace build tool
        uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          bb: '1.13.225'
      - run: npm ci --ignore-scripts
      - run: node --test test/scripts/css_pruning_test.mjs test/scripts/compiler_cache_test.mjs
      - run: bb -cp scripts:src/cljc:resources test/scripts/neovim_workspace_test.clj
      - run: npm run build

  build-and-deploy:
    needs: validate-css
    runs-on: ubuntu-latest

    # Legacy CapRover is opt-in; its old Firebase-only runtime is not the Coolify target.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.CAPROVER_DEPLOY_ENABLED == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: CapRover Deploy Token
        uses: Fabrimat/caprover-action@v2.3 
        with:
          server: '${{ vars.CAPROVER_SERVER }}'
          appname: '${{ vars.APP_NAME }}'
          token: '${{ secrets.APP_TOKEN }}'
          branch: master
