name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Warm ClojureScript dependencies
        run: npx shadow-cljs compile app-dev
